# joongo_notify 설정 예시 — config.yaml로 복사해 사용
# 민감값(토큰, 해시)은 환경변수로도 지정 가능: JOONGO_TELEGRAM_TOKEN, JOONGO_AUTH_PASSWORD_HASH 등

db_path: joongo_notify.db
data_dir: data

auth:
  username: admin
  # `joongo-notify hash-password`로 생성 (평문 비밀번호 저장 금지)
  password_hash: ""
  # 재시작 후에도 세션 유지하려면 고정값 지정 (미지정 시 기동마다 랜덤 = 재시작 시 재로그인)
  session_secret: ""

llm:
  enabled: false          # true + model 지정 시 Ollama 본문 분석 사용, 아니면 휴리스틱
  base_url: http://127.0.0.1:11434
  model: ""               # 발주자 벤치마크 후 선정 (Q3). 예: "qwythos:9b"
  timeout_seconds: 120

vl:                       # ③단계 사진 검증 (FR-C3) — Watch 조건의 시각검증가능 속성만
  enabled: false
  base_url: http://127.0.0.1:11434
  model: ""               # 예: "qwen2.5vl:3b" (Q4 벤치마크 후 선정)
  max_images: 3

telegram:
  enabled: false
  token: ""               # BotFather 발급 토큰 (환경변수 권장)
  chat_id: ""             # 웹 설정 화면에서도 등록 가능

collect:
  platforms: [bunjang, daangn, joongna]  # 당근은 Watch 지역이 "동이름-지역ID" 형식일 때만 수집
  default_interval_minutes: 30   # 저빈도 확정 전제 (10번 문서 §8)
  min_interval_minutes: 15
  request_delay_min_seconds: 2
  request_delay_max_seconds: 5
  max_requests_per_minute: 10

autochat:                 # 자동 채팅 (FR-D6) — 완전 자동 원안. 계정 제재 리스크 인지 필요
  enabled: false          # true여야 auto 모드 문의가 실제 발송됨
  dry_run: true           # true면 입력창까지만(전송 안 함) — 셀렉터 검증용. 검증 후 false
  hourly_limit: 2         # 발송 상한 (계정 보호)
  daily_limit: 5
  headless: true
  profile_dir: chat_profiles   # `joongo-notify chat-login <platform>`으로 로그인 세션 저장
  # 사전 준비: 1) chat-login으로 각 플랫폼 로그인  2) data/chat_selectors.yaml 셀렉터 채우기
  #           3) dry_run으로 검증  4) dry_run=false + enabled=true

web:
  host: 127.0.0.1
  port: 8320
  base_url: ""            # 외부 접속 주소 (미설정 시 host:port). 알림 승인 링크에 사용
