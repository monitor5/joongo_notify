# joongo_notify 설정 예시 — config.yaml로 복사해 사용
# 민감값(토큰, 해시)은 환경변수로도 지정 가능: JOONGO_TELEGRAM_TOKEN, JOONGO_AUTH_PASSWORD_HASH 등

db_path: joongo_notify.db
data_dir: data

auth:
  username: admin
  # `joongo-notify hash-password`로 생성 (평문 비밀번호 저장 금지)
  password_hash: ""
  # 재시작 후에도 세션 유지하려면 고정값 지정 (미지정 시 기동마다 랜덤 = 재시작 시 재로그인)
  session_secret: ""

llm:
  enabled: false          # true + model 지정 시 Ollama 본문 분석 사용, 아니면 휴리스틱
  base_url: http://127.0.0.1:11434
  model: ""               # 발주자 벤치마크 후 선정 (Q3). 예: "qwythos:9b"
  timeout_seconds: 120

telegram:
  enabled: false
  token: ""               # BotFather 발급 토큰 (환경변수 권장)
  chat_id: ""             # 웹 설정 화면에서도 등록 가능

collect:
  default_interval_minutes: 30   # 저빈도 확정 전제 (10번 문서 §8)
  min_interval_minutes: 15
  request_delay_min_seconds: 2
  request_delay_max_seconds: 5
  max_requests_per_minute: 10

web:
  host: 127.0.0.1
  port: 8320
