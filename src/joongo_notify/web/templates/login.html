<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>로그인 — joongo_notify</title>
<style>
body { font-family: -apple-system, "Malgun Gothic", sans-serif; display: flex; justify-content: center; padding-top: 12vh; }
form { border: 1px solid #8884; border-radius: 8px; padding: 24px; min-width: 280px; }
input { display: block; width: 100%; margin: 6px 0 12px; padding: 8px; box-sizing: border-box; }
button { width: 100%; padding: 8px; }
.error { color: #c33; font-size: 14px; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h3>🔔 joongo_notify</h3>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  {% if locked %}<p class="error">로그인이 일시 잠금되었습니다. 잠시 후 다시 시도하세요.</p>{% endif %}
  <label>아이디 <input type="text" name="username" required autofocus></label>
  <label>비밀번호 <input type="password" name="password" required></label>
  <button {% if locked %}disabled{% endif %}>로그인</button>
</form>
</body>
</html>
